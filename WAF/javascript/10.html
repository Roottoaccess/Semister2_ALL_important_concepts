<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Document</title>
</head>
<style type="text/css">
    .regtext{
        font-family: 'Times New Roman', Times, serif; font-size: 14pt; width: 600px;
    }
    .abstext{
        position: absolute; top: 30px; left: 50px;
        font-family: Times; font-size: 24pt; font-style: italic;
        color: rgb(255,104,102); width: 600px;
    }
</style>
<body>
    <p class="regtext">
        Apple Aple Apple Apple Apple Apple Apple Apple Apple Apple
        Apple Apple Apple Apple Apple Apple Apple Apple Apple Apple
        Apple Apple Apple Apple Apple Apple Apple Apple Apple Apple
        Apple Apple Apple Apple Apple Apple Apple Apple Apple Apple
    </p>
    <p class="abstext">
        Apples are Good for you
    </p>
</body>
</html>
