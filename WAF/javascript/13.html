<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visibility Control</title>
</head>
<body>
    <form action="">
        <div id="nature" style="position: relative; visibility: visible;">
            <img src="nature.jpg" alt="(Nature Picture)" width="500" height="500"/>
            <pre>picture of nature 🤩</pre>
        </div>
        <p>
            <br>
            <input type="button" value="Toggle Picture" onclick="flipImage()">
        </p>
    </form>

    <!-- Place script here for better load timing -->
    <script type="text/javascript" src="showHide.js"></script>
</body>
</html>
